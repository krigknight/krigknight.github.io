<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farhan | EEE student, embedded systems</title>
<meta name="description" content="Farhan, EEE student at SUST. Embedded systems projects, resources, and writing.">
<meta id="themeColor" name="theme-color" content="#221a33">
<script>try { if (localStorage.getItem("theme") === "light") { document.documentElement.classList.add("light"); document.getElementById("themeColor").content = "#f5f1fb"; } } catch (e) {}</script>
<meta property="og:type" content="website">
<meta property="og:title" content="Farhan">
<meta property="og:description" content="EEE student who likes embedded systems. Open the terminal to explore.">
<!-- EDIT: after hosting, use your full link, e.g. https://yourname.github.io/preview.png (1200x630) -->
<meta property="og:image" content="https://yourname.github.io/preview.png">
<style>
  :root { --bg:#221a33; --fg:#e9e2f5; --dim:#9a8eb5; --accent:#a970ff; --link:#d6b8ff; --name:#5eead4; --intro:#e9e2f5; }
  ::selection { background:rgba(169,112,255,.35); }
  html.light { --bg:#f5f1fb; --fg:#241d33; --dim:#6f6585; --accent:#6d28d9; --link:#5b3fb0; --name:#0f766e; --intro:#241d33; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font:15px/1.65 ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace; min-height:100vh; }
  #term, #plain { max-width:820px; margin:0 auto; padding:16px 16px 80px; }
  .bar { display:flex; justify-content:space-between; margin-bottom:14px; font-size:13px; }
  #hero { margin:6px 0 20px; }
  #name { margin:0 0 10px; font-size:clamp(2rem, 8vw, 3.4rem); line-height:1.1; font-weight:800; color:var(--name); overflow-wrap:anywhere; }
  #intro { color:var(--intro); max-width:68ch; white-space:pre-wrap; }
  #plain h1 { color:var(--name); }
  .line { white-space:pre-wrap; word-break:break-word; }
  .kv { display:grid; grid-template-columns:12ch 1fr; gap:0 1ch; }
  .dim { color:var(--dim); } .accent { color:var(--accent); }
  .big { font-size:1.35em; font-weight:700; }
  .gap { height:10px; }
  a { color:var(--link); text-decoration:underline; text-underline-offset:3px; }
  a.cmd { color:var(--accent); text-decoration:none; border-bottom:1px dashed var(--accent); }
  a:focus-visible, input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  img { max-width:100%; height:auto; border:1px solid var(--dim); margin:6px 0; display:block; }
  .row { display:flex; gap:8px; }
  .prompt { color:var(--accent); flex-shrink:0; }
  #cmd { flex:1; min-width:0; background:none; border:0; padding:0; color:var(--fg); font:inherit; caret-color:var(--accent); caret-shape:block; }
  #cmd:focus-visible { outline:none; }
  .row:focus-within { background:rgba(169,112,255,.10); }
  .blink::after { content:"\2588"; color:var(--accent); animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #plain { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.7; }
  #plain h1 { margin:.6em 0 0; font-size:2em; } #plain h2 { margin:2em 0 .4em; font-size:1.2em; border-bottom:1px solid var(--dim); padding-bottom:4px; }
  #plain h3 { margin:1.2em 0 .2em; } #plain dt { color:var(--dim); font-size:.85em; margin-top:.5em; } #plain dd { margin:0; }
  .btn { background:none; border:1px solid var(--dim); color:var(--fg); font:inherit; font-size:13px; padding:4px 10px; cursor:pointer; }
  @media (max-width:480px) { body { font-size:14px; } }
  @media (prefers-reduced-motion:reduce) { .blink::after { animation:none; } }
</style>
</head>
<body>
<main id="term" aria-label="Terminal portfolio">
  <div class="bar"><span class="dim">farhan.sh</span><span><a href="#" id="themelink">light / dark</a>&nbsp;&nbsp;&nbsp;<a href="#" id="plainlink">view as plain page</a></span></div>
  <noscript><p>This site is a terminal and needs JavaScript. Farhan, EEE student at SUST. Embedded systems.</p></noscript>
  <header id="hero"><h1 id="name"></h1><div id="intro"></div></header>
  <div id="out"></div>
  <label class="row">
    <span class="prompt" id="prompt">guest@farhan:~$</span>
    <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type a command">
  </label>
</main>
<article id="plain" hidden></article>

<script>
/* ============================================================
   EDIT THIS BLOCK. Everything visitors see comes from here.
   Keep the quotes and commas. Replace the placeholder text.
   Every project, blog post and resource needs a short lowercase name with no
   spaces. Visitors open it by typing: cat name
   Resume: put your PDF next to index.html and name it resume.pdf
   (or change the name below). Images: same idea, e.g. "img/p1.jpg".
   ============================================================ */
const DATA = {
  name: "Farhan",
  tagline: "EEE student at SUST. I like embedded systems.",
  intro: [
    "I study Electrical and Electronic Engineering at SUST.",
    "I like embedded systems and building things to learn how they work.",
    "I enjoy turning ideas into small, working projects, and I write down what I learn along the way.",
    "This is where I keep my projects, useful resources, and notes. Look around using the commands below."
  ],
  about: [
    "I am an Electrical and Electronic Engineering student at",
    "Shahjalal University of Science and Technology.",
    "",
    "I like embedded systems, and I build things to learn them.",
    "This site collects my projects, resources I find useful, and notes."
  ],
  projects: [
    { name: "project-one", desc: "One line: what it does.",
      problem: "What problem does it solve? One or two sentences.",
      built: "What you built and how it works.",
      stack: "ESP32, C++, sensors, etc.",
      result: "What happened. A number or a photo of it working.",
      image: "", link: "https://github.com/yourname/project-one" },
    { name: "project-two", desc: "One line: what it does.",
      problem: "", built: "", stack: "", result: "", image: "", link: "" }
  ],
  resources: [
    { name: "resource-one", title: "Resource title", note: "Why it is worth your time.", link: "https://example.com" }
  ],
  blog: [
    { name: "first-post", date: "2026-11-12", title: "My first post", link: "blog/first-post.html" }
  ],
  contact: [
    { label: "email", text: "you@example.com", link: "mailto:you@example.com" },
    { label: "github", text: "github.com/yourname", link: "https://github.com/yourname" },
    { label: "linkedin", text: "linkedin.com/in/yourname", link: "https://linkedin.com/in/yourname" }
  ],
  resume: "resume.pdf"
};
/* ============================ end of edit block ============================ */

const SECTIONS = ["about", "projects", "resources", "blog", "contact", "resume"];
const TOUCH = matchMedia("(pointer: coarse)").matches;
const out = document.getElementById("out");
const input = document.getElementById("cmd");
const nameEl = document.getElementById("name");
const introEl = document.getElementById("intro");
let skip = false;
let booting = false;
let cwd = "";
const DIRS = ["projects", "resources", "blog"];
const promptText = () => "guest@farhan:~" + (cwd ? "/" + cwd : "") + "$";
const setPrompt = () => { document.getElementById("prompt").textContent = promptText(); };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const cmdLink = (c, label = c) => `<a href="#" class="cmd" data-cmd="${esc(c)}">${esc(label)}</a>`;
const ext = (url, text) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : `<span class="dim">${esc(text)}</span>`;
const sleep = ms => new Promise(r => setTimeout(r, skip ? 0 : ms));
const toBottom = () => window.scrollTo(0, document.body.scrollHeight);

function print(html = "", cls = "") {
  const d = document.createElement("div");
  d.className = "line " + cls;
  d.innerHTML = html || "&nbsp;";
  out.appendChild(d);
  toBottom();
  return d;
}
function kv(k, vHtml) { print(`<span class="dim">${esc(k)}</span><span>${vHtml}</span>`, "kv"); }
function gap() { const d = document.createElement("div"); d.className = "gap"; out.appendChild(d); }

async function typeTo(d, text, ms = 24) {
  if (skip) { d.textContent = text; return; }
  d.textContent = "";
  d.classList.add("blink");
  for (const ch of text) {
    if (skip) { d.textContent = text; break; }
    d.textContent += ch;
    await sleep(ms);
  }
  d.classList.remove("blink");
}

const findProject = n => DATA.projects.find(p => p.name.toLowerCase() === n);
const findEntry = n => DATA.blog.find(b => b.name === n) || DATA.resources.find(r => r.name === n);
const allNames = () => DATA.projects.concat(DATA.blog, DATA.resources).map(x => x.name);
function openHint() {
  print(`<span class="dim">Tap a name, or type: cat &lt;name&gt;</span>`);
  print(`<span class="dim">To go back, type: cd ..</span>`);
}
function openEntry(e) {
  if (!e.link) return print("No link set for this entry yet.");
  print(esc(e.title) + (e.date ? ` <span class="dim">${esc(e.date)}</span>` : ""));
  print(`<span class="dim">Opening in a new tab:</span> ${ext(e.link, e.link)}`);
  window.open(e.link, "_blank", "noopener");
}
const fields = p => [["problem", p.problem], ["built", p.built], ["stack", p.stack], ["result", p.result]].filter(f => f[1]);

const show = {
  about() { DATA.about.forEach(l => print(esc(l))); },
  projects() {
    DATA.projects.forEach((p, i) => { if (i) gap(); print(cmdLink("cat " + p.name, p.name)); print(esc(p.desc)); });
    gap(); openHint();
  },
  project(p) {
    print(`<span class="accent big">${esc(p.name)}</span>`);
    print(esc(p.desc)); gap();
    fields(p).forEach(([k, v]) => kv(k, esc(v)));
    if (p.image) print(`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`);
    if (p.link) kv("code", ext(p.link, p.link));
  },
  resources() {
    DATA.resources.forEach((r, i) => { if (i) gap(); print(cmdLink("cat " + r.name, r.name)); print(`${esc(r.title)}  <span class="dim">${esc(r.note)}</span>`); });
    gap(); openHint();
  },
  blog() {
    DATA.blog.forEach(b => kv(b.date, cmdLink("cat " + b.name, b.name) + `  <span class="dim">${esc(b.title)}</span>`));
    gap(); openHint();
  },
  contact() { DATA.contact.forEach(c => kv(c.label, ext(c.link, c.text))); },
  resume() {
    if (!DATA.resume) return print("No resume yet.");
    print(`<a href="${esc(DATA.resume)}" download>Download resume (PDF)</a>`);
  }
};

const isLight = () => document.documentElement.classList.contains("light");
function setTheme(t) {
  document.documentElement.classList.toggle("light", t === "light");
  document.getElementById("themeColor").content = t === "light" ? "#f5f1fb" : "#221a33";
  try { localStorage.setItem("theme", t); } catch (e) {}
}
function themeRow() {
  print(cmdLink("light") + " " + cmdLink("dark") + "    " + `<span class="dim">switch the color theme</span>`);
}

function helpRows(rows) {
  rows.forEach(([c, d]) => {
    const label = c.includes(" ") ? esc(c) : cmdLink(c);
    print(label + " ".repeat(Math.max(2, 14 - c.length)) + `<span class="dim">${esc(d)}</span>`);
  });
}

const commands = {
  help() {
    helpRows([["ls", "list what is here"], ["cd <dir>", "enter a directory (cd .. to go back)"],
      ["cat <file>", "open a file or project"], ["resume", "download my CV"],
      ["plain", "switch to a normal page"], ["replay", "play the boot animation again"],
      ["whoami", "one-line intro"], ["clear", "clean the screen"]]);
    themeRow();
    print(`<span class="dim">Tab completes. Arrow up/down brings back old commands.</span>`);
  },
  ls() {
    if (cwd === "projects") return show.projects();
    if (cwd === "resources") return show.resources();
    if (cwd === "blog") return show.blog();
    print(SECTIONS.map(s => DIRS.includes(s) ? cmdLink("cd " + s, s + "/") : cmdLink("cat " + s, s)).join("    "));
  },
  cd(arg) {
    const a = (arg || "").replace(/\/$/, "");
    if (!a || a === "~" || a === "..") { cwd = ""; setPrompt(); return commands.ls(); }
    if (DIRS.includes(a)) { cwd = a; setPrompt(); return commands.ls(); }
    if (SECTIONS.includes(a) || findProject(a) || findEntry(a)) return print(`cd: ${esc(a)}: not a directory. Try: cat ${esc(a)}`);
    print(`cd: ${esc(a)}: no such directory. Type ${cmdLink("ls")} to see what exists.`);
  },
  whoami() { print(esc(DATA.name)); print(`<span class="dim">${esc(DATA.tagline)}</span>`); },
  clear() { out.innerHTML = ""; },
  plain() { setPlain(true); },
  theme(arg) {
    if (arg && arg !== "light" && arg !== "dark") return print("theme: use light or dark");
    const t = arg || (isLight() ? "dark" : "light");
    setTheme(t);
    print(`Theme: ${t}. Type ${cmdLink(t === "light" ? "dark" : "light")} to switch back.`);
  },
  light() { commands.theme("light"); },
  dark() { commands.theme("dark"); },
  replay() {
    if (booting) return print("Still loading. Try again in a moment.");
    out.innerHTML = ""; cwd = ""; setPrompt();
    setTimeout(() => { skip = false; armSkip(); boot(); }, 60);
  },
  cat(arg) {
    if (!arg) return print("cat: missing name. Try: cat projects");
    if (DIRS.includes(arg)) return print(`cat: ${esc(arg)}: is a directory. Try: cd ${esc(arg)}`);
    if (SECTIONS.includes(arg)) return show[arg]();
    const p = findProject(arg);
    if (p) return show.project(p);
    const e = findEntry(arg);
    if (e) return openEntry(e);
    print(`cat: ${esc(arg)}: no such file. Type ${cmdLink("ls")} to see what exists.`);
  },
  sudo() { print("guest is not in the sudoers file. This incident will be reported."); }
};
SECTIONS.forEach(s => { commands[s] = () => DIRS.includes(s) ? commands.cd(s) : show[s](); });

const history = [];
let hIndex = 0;

function run(raw) {
  const line = raw.trim();
  print(`<span class="prompt">${promptText()}</span> ${esc(raw)}`);
  if (!line) return;
  history.push(line); hIndex = history.length;
  const [name, ...args] = line.split(/\s+/);
  const key = name.toLowerCase();
  const arg = args[0] && args[0].toLowerCase();
  if (commands[key]) commands[key](arg);
  else if (findProject(key)) show.project(findProject(key));
  else if (findEntry(key)) openEntry(findEntry(key));
  else print(`command not found: ${esc(name)}. Type ${cmdLink("help")}.`);
  if (!["clear", "plain", "replay"].includes(key)) gap();
  toBottom();
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const v = input.value; input.value = "";
    run(v);
  } else if (e.key === "ArrowUp") {
    e.preventDefault(); if (hIndex > 0) input.value = history[--hIndex];
  } else if (e.key === "ArrowDown") {
    e.preventDefault(); hIndex = Math.min(hIndex + 1, history.length); input.value = history[hIndex] || "";
  } else if (e.key === "Tab") {
    e.preventDefault();
    const parts = input.value.split(/\s+/);
    const pool = parts.length > 1 ? SECTIONS.concat(allNames()) : Object.keys(commands).concat(allNames());
    const hits = pool.filter(c => c.startsWith(parts[parts.length - 1].toLowerCase()));
    if (hits.length === 1) { parts[parts.length - 1] = hits[0]; input.value = parts.join(" "); }
  }
});

out.addEventListener("click", e => {
  const a = e.target.closest("a.cmd");
  if (!a) return;
  e.preventDefault();
  run(a.dataset.cmd);
  if (!TOUCH) input.focus();
});
document.addEventListener("click", e => {
  if (!TOUCH && !e.target.closest("a, button") && !getSelection().toString()) input.focus();
});

/* ---------- plain page (for people who do not want a terminal) ---------- */
const term = document.getElementById("term");
const plainEl = document.getElementById("plain");

function buildPlain() {
  const sec = (t, inner) => `<section><h2>${t}</h2>${inner}</section>`;
  const proj = p => `<h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p>` +
    (fields(p).length ? `<dl>${fields(p).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : "") +
    (p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">` : "") +
    (p.link ? `<p>${ext(p.link, "Code")}</p>` : "");
  return `<button class="btn" id="back">Back to terminal</button> <button class="btn" id="themebtn">Light / dark</button>
    <h1>${esc(DATA.name)}</h1><p class="dim">${esc(DATA.tagline)}</p>
    ${sec("About", `<p>${esc(DATA.about.join(" ").replace(/\s+/g, " "))}</p>`)}
    ${sec("Projects", DATA.projects.map(proj).join(""))}
    ${sec("Resources", DATA.resources.map(r => `<p>${ext(r.link, r.title)}<br><span class="dim">${esc(r.note)}</span></p>`).join(""))}
    ${sec("Blog", DATA.blog.map(b => `<p><span class="dim">${esc(b.date)}</span> ${ext(b.link, b.title)}</p>`).join(""))}
    ${sec("Contact", DATA.contact.map(c => `<p>${esc(c.label)}: ${ext(c.link, c.text)}</p>`).join("") + (DATA.resume ? `<p><a href="${esc(DATA.resume)}" download>Download resume (PDF)</a></p>` : ""))}`;
}
function setPlain(on) {
  document.body.classList.toggle("plain", on);
  term.hidden = on; plainEl.hidden = !on;
  if (on) { plainEl.innerHTML = buildPlain(); window.scrollTo(0, 0); document.getElementById("back").onclick = () => setPlain(false); document.getElementById("themebtn").onclick = () => setTheme(isLight() ? "dark" : "light"); }
  else if (!TOUCH) input.focus();
}
document.getElementById("plainlink").addEventListener("click", e => { e.preventDefault(); setPlain(true); });
document.getElementById("themelink").addEventListener("click", e => { e.preventDefault(); setTheme(isLight() ? "dark" : "light"); });

/* ---------- landing sequence: boot, intro, then ls runs itself ---------- */
async function boot() {
  booting = true;
  out.setAttribute("aria-live", "off");
  nameEl.textContent = ""; introEl.innerHTML = "";
  await typeTo(nameEl, `Hi, I am ${DATA.name}.`, 55);
  for (const line of DATA.intro) {
    const d = document.createElement("div");
    introEl.appendChild(d);
    await typeTo(d, line, 9);
  }
  await sleep(250);
  const steps = ["power rails stable", "clock locked"].concat(SECTIONS.map(s => "loading " + s));
  const bar = print("", "accent");
  for (let i = 0; i < steps.length; i++) {
    print(`<span class="accent">[ ok ]</span> ${esc(steps[i])}`);
    const w = 24, f = Math.round(w * (i + 1) / steps.length);
    bar.textContent = "[" + "\u2588".repeat(f) + "\u2591".repeat(w - f) + "] " + Math.round(100 * (i + 1) / steps.length) + "%";
    out.appendChild(bar);
    await sleep(110);
  }
  gap(); await sleep(250);
  gap(); await sleep(350);
  let added = "";
  if (!skip) {
    for (const ch of "ls") { if (skip) break; added += ch; input.value += ch; await sleep(150); }
    await sleep(300);
  }
  if (input.value === added) input.value = "";
  run("ls");
  gap();
  helpRows([["ls", "list what is here"], ["cd <dir>", "enter a directory, e.g. cd projects"],
    ["cat <file>", "open a file, e.g. cat about"], ["help", "all commands"]]);
  themeRow();
  print(`<span class="dim">On a phone, just tap the highlighted words. Not a terminal person?</span> ${cmdLink("plain")}`);
  out.setAttribute("aria-live", "polite");
  booting = false;
}
function armSkip() { ["keydown", "pointerdown"].forEach(ev => addEventListener(ev, () => { skip = true; }, { once: true })); }
armSkip();
if (!TOUCH) input.focus();
boot();
</script>
</body>
</html>
